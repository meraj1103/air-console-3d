<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080c16">
  <title>AirConsole Joy-Con Controller</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Custom Controller Styles -->
  <link rel="stylesheet" href="/css/controller.css">
</head>

<body class="bg-[#080c16] text-slate-100 flex flex-col h-screen w-screen overflow-hidden select-none">
  <!-- Scanline overlay -->
  <div class="fixed inset-0 phone-scanline z-40"></div>

  <!-- ============================================== -->
  <!-- 1. JOIN SCREEN (PIN Entry / Auto-Connect)      -->
  <!-- ============================================== -->
  <div id="join-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 bg-[#080c16]">
    <div class="w-full max-w-sm flex flex-col items-center text-center">
      <div
        class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-pink-500 flex items-center justify-center text-3xl shadow-[0_0_30px_rgba(0,240,255,0.4)] mb-3">
        🎮
      </div>
      <h1
        class="font-orbitron font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-1">
        AIR-JOYCON
      </h1>
      <p class="text-xs text-slate-400 font-mono mb-6">Wireless Mobile Gamepad for Laptop Console</p>

      <!-- Room Code Input -->
      <div class="w-full mb-4">
        <label class="block text-[11px] font-mono tracking-widest text-slate-400 mb-2 uppercase text-left">
          Enter 4-Digit Room Code:
        </label>
        <input id="room-input" type="text" maxlength="6" placeholder="e.g. 4JDA" autocomplete="off"
          autocapitalize="characters"
          class="w-full bg-slate-900 border-2 border-cyan-400/50 focus:border-cyan-400 focus:outline-none rounded-2xl py-3.5 text-center font-orbitron font-black text-3xl tracking-widest text-cyan-300 shadow-[0_0_20px_rgba(0,240,255,0.15)] uppercase">
      </div>

      <p id="join-error"
        class="hidden text-xs text-rose-400 font-mono mb-4 bg-rose-950/40 border border-rose-500/30 rounded-lg p-2.5 w-full">
      </p>

      <button id="join-btn"
        class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-pink-500 font-orbitron font-black text-sm tracking-widest text-white shadow-[0_0_25px_rgba(0,240,255,0.4)] active:scale-95 transition">
        CONNECT AS GAMEPAD ⚡
      </button>

      <p class="text-[11px] text-slate-500 font-mono mt-6">
        💡 Tip: Rotate your phone to Landscape mode for the ultimate console gamepad feel!
      </p>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 2. GAMEPAD SCREEN (Joy-Con Wireless Controller) -->
  <!-- ============================================== -->
  <div id="gamepad-screen" class="hidden flex flex-col h-full w-full relative">
    <!-- Shoulder Bumpers & Status Bar -->
    <header class="h-14 border-b border-white/10 bg-slate-950/90 px-4 flex items-center justify-between z-30 shrink-0">
      <!-- Left Bumper [L1] -->
      <button id="btn-l1" class="shoulder-btn px-4 py-2 flex items-center gap-1.5 text-slate-200">
        <span class="font-orbitron font-black text-xs">L1</span>
        <span id="label-l1" class="text-[9px] font-mono text-cyan-400 uppercase">NITRO</span>
      </button>

      <!-- Center LCD Stats -->
      <div class="flex items-center gap-3">
        <span id="player-badge"
          class="px-3 py-1 rounded-full text-xs font-mono font-black tracking-widest bg-cyan-500/20 text-cyan-400 border border-cyan-400/40">
          JOY-CON 1
        </span>
        <!-- Mini Status Gauge -->
        <div class="flex items-center gap-1.5 w-24">
          <div class="flex-1 bg-slate-900 rounded-full h-2 p-0.5 border border-white/10 overflow-hidden">
            <div id="mobile-hp-bar" class="bg-cyan-400 h-full rounded-full transition-all duration-150 w-full"></div>
          </div>
          <span id="mobile-hp-text" class="text-[10px] font-mono text-cyan-300">100%</span>
        </div>
        <span id="ping-badge" class="text-[10px] font-mono text-slate-400 flex items-center">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse mr-1"></span>--ms
        </span>
      </div>

      <!-- Right Bumper [R1] -->
      <button id="btn-r1" class="shoulder-btn px-4 py-2 flex items-center gap-1.5 text-slate-200">
        <span id="label-r1" class="text-[9px] font-mono text-pink-400 uppercase">ITEM</span>
        <span class="font-orbitron font-black text-xs">R1</span>
      </button>
    </header>

    <!-- Main Controller Split (Thumbstick Left / Diamond Pad Right) -->
    <main class="flex-1 flex w-full relative touch-none overflow-hidden joycon-grip-left joycon-grip-right">
      <!-- Left Half: Dynamic Floating Thumbstick Zone -->
      <div id="joystick-zone" class="w-1/2 h-full relative border-r border-white/10 flex items-center justify-center">
        <!-- Floating Joystick Visual -->
        <div id="joystick-base" class="hidden">
          <div id="joystick-handle"></div>
        </div>

        <!-- Ambient Guide -->
        <div class="pointer-events-none text-center opacity-30 flex flex-col items-center">
          <div
            class="w-24 h-24 rounded-full border-2 border-dashed border-white/40 flex items-center justify-center mb-1">
            <span class="text-3xl">🕹️</span>
          </div>
          <span class="text-[11px] font-orbitron font-bold tracking-widest text-slate-400 uppercase">ANALOG
            THUMBSTICK</span>
        </div>
      </div>

      <!-- Right Half: 4-Button Diamond Action Pad (A, B, X, Y) -->
      <div id="buttons-zone" class="w-1/2 h-full relative flex items-center justify-center">
        <div class="relative w-56 h-56 flex items-center justify-center">
          <!-- Button Y (Top - Yellow) -->
          <button id="btn-y" class="face-btn btn-y absolute top-0 text-slate-900 font-orbitron font-black">
            <span class="text-base font-black">Y</span>
            <span id="label-y" class="text-[8px] font-sans font-bold leading-none uppercase">BOOST</span>
          </button>

          <!-- Button X (Left - Blue) -->
          <button id="btn-x" class="face-btn btn-x absolute left-0 text-white font-orbitron font-black">
            <span class="text-base font-black">X</span>
            <span id="label-x" class="text-[8px] font-sans font-bold leading-none uppercase">ITEM</span>
          </button>

          <!-- Button B (Right - Red) -->
          <button id="btn-b" class="face-btn btn-b absolute right-0 text-white font-orbitron font-black">
            <span class="text-base font-black">B</span>
            <span id="label-b" class="text-[8px] font-sans font-bold leading-none uppercase">BRAKE</span>
          </button>

          <!-- Button A (Bottom - Green / Primary Action) -->
          <button id="btn-a" class="face-btn btn-a absolute bottom-0 text-slate-950 font-orbitron font-black">
            <span class="text-base font-black">A</span>
            <span id="label-a" class="text-[8px] font-sans font-bold leading-none uppercase">ACCEL</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Bottom Utility Strip with Retro SELECT & START -->
    <footer class="h-12 border-t border-white/10 bg-slate-950/90 px-4 flex items-center justify-between text-xs text-slate-400 font-mono">
      <button id="gyro-toggle-btn" class="px-2.5 py-1.5 rounded bg-slate-900 border border-white/10 text-[10px] active:bg-cyan-500/20">
        🧭 TILT: OFF
      </button>

      <!-- SNES Select & Start Pill Buttons -->
      <div class="flex items-center gap-3">
        <button id="btn-select" class="px-3.5 py-1 rounded-full bg-slate-800 border border-slate-600 active:scale-90 text-[10px] font-orbitron font-bold text-slate-300 shadow-[inset_0_1px_2px_rgba(255,255,255,0.2)]">
          SELECT
        </button>
        <button id="btn-start" class="px-4 py-1 rounded-full bg-slate-800 border border-slate-600 active:scale-90 text-[10px] font-orbitron font-bold text-cyan-300 shadow-[inset_0_1px_2px_rgba(255,255,255,0.2)]">
          START
        </button>
      </div>

      <button id="fullscreen-btn" class="px-2.5 py-1.5 rounded bg-slate-900 border border-white/10 text-[10px]">
        ⛶ FULLSCREEN
      </button>
    </footer>

    <!-- Rematch Modal on Phone -->
    <div id="mobile-rematch-modal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-6">
      <div
        class="bg-slate-900 border-2 border-cyan-400 p-6 rounded-3xl w-full max-w-xs text-center shadow-[0_0_40px_rgba(0,240,255,0.3)]">
        <h2 id="mobile-winner-text" class="font-orbitron font-black text-3xl mb-4">🏆 VICTORY!</h2>
        <button id="mobile-rematch-btn"
          class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-pink-500 font-orbitron font-bold text-sm tracking-wider text-white shadow-[0_0_20px_rgba(0,240,255,0.4)]">
          READY FOR REMATCH 🔄
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/audio.js"></script>
  <script src="/js/controller.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060913">
  <title>AirConsole Gamepad</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Custom Controller Styles -->
  <link rel="stylesheet" href="/css/controller.css">
</head>
<body class="bg-[#060913] text-slate-100 flex flex-col h-screen w-screen overflow-hidden select-none">
  <!-- Subtle CRT Scanline overlay -->
  <div class="fixed inset-0 phone-scanline z-40"></div>

  <!-- ============================================== -->
  <!-- 1. JOIN SCREEN (PIN Entry / Auto-Connect)      -->
  <!-- ============================================== -->
  <div id="join-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 bg-[#060913]">
    <div class="w-full max-w-sm flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-pink-500 flex items-center justify-center text-3xl shadow-[0_0_30px_rgba(0,240,255,0.4)] mb-4">
        🎮
      </div>
      <h1 class="font-orbitron font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-1">
        AIR-GAMEPAD
      </h1>
      <p class="text-xs text-slate-400 font-mono mb-8">Connect this phone to the laptop game screen</p>

      <!-- Room Code Input -->
      <div class="w-full mb-4">
        <label class="block text-[11px] font-mono tracking-widest text-slate-400 mb-2 uppercase text-left">
          Enter 4-Digit Room Code:
        </label>
        <input 
          id="room-input" 
          type="text" 
          maxlength="6" 
          placeholder="e.g. 7842" 
          autocomplete="off"
          autocapitalize="characters"
          class="w-full bg-slate-900 border-2 border-cyan-400/50 focus:border-cyan-400 focus:outline-none rounded-2xl py-4 text-center font-orbitron font-black text-3xl tracking-widest text-cyan-300 shadow-[0_0_20px_rgba(0,240,255,0.15)] uppercase"
        >
      </div>

      <p id="join-error" class="hidden text-xs text-rose-400 font-mono mb-4 bg-rose-950/40 border border-rose-500/30 rounded-lg p-2.5 w-full"></p>

      <button id="join-btn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 font-orbitron font-black text-sm tracking-widest text-white shadow-[0_0_25px_rgba(0,240,255,0.4)] active:scale-95 transition">
        CONNECT CONTROLLER ⚡
      </button>

      <p class="text-[11px] text-slate-500 font-mono mt-6">
        Make sure your phone is connected to the same Wi-Fi / Hotspot as the laptop!
      </p>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 2. GAMEPAD SCREEN (The Mobile Game Controller) -->
  <!-- ============================================== -->
  <div id="gamepad-screen" class="hidden flex flex-col h-full w-full relative">
    <!-- Top Controller Status Bar -->
    <header class="h-12 border-b border-white/10 bg-slate-950/80 px-4 flex items-center justify-between z-30 shrink-0">
      <div class="flex items-center gap-2">
        <span id="player-badge" class="px-3 py-1 rounded-full text-xs font-mono font-black tracking-widest bg-cyan-500/20 text-cyan-400 border border-cyan-400/40">
          PLAYER 1
        </span>
        <span id="ping-badge" class="text-[11px] font-mono text-slate-400 flex items-center">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-1"></span>--ms
        </span>
      </div>

      <!-- Quick Health Gauge on Controller -->
      <div class="flex items-center gap-2 w-36">
        <span class="text-[10px] font-mono text-slate-400">HP:</span>
        <div class="flex-1 bg-slate-900 rounded-full h-2 p-0.5 border border-white/10 overflow-hidden">
          <div id="mobile-hp-bar" class="bg-cyan-400 h-full rounded-full transition-all duration-150 w-full"></div>
        </div>
        <span id="mobile-hp-text" class="text-[10px] font-mono text-cyan-300">100%</span>
      </div>

      <!-- Toggles (Gyro & Fullscreen) -->
      <div class="flex items-center gap-2">
        <button id="gyro-toggle-btn" class="px-2.5 py-1 rounded-lg bg-slate-900 border border-white/10 text-[10px] font-mono text-slate-300 active:bg-cyan-500/20">
          🧭 TILT: OFF
        </button>
        <button id="fullscreen-btn" class="p-1.5 rounded-lg bg-slate-900 border border-white/10 text-xs text-slate-300">
          ⛶
        </button>
      </div>
    </header>

    <!-- Main Gamepad Controls Area (Split Left/Right) -->
    <main class="flex-1 flex w-full relative touch-none overflow-hidden">
      <!-- Left Half: Dynamic Virtual Thumbstick Zone -->
      <div id="joystick-zone" class="w-1/2 h-full relative border-r border-white/5 flex items-center justify-center">
        <!-- Floating Joystick Visual Element -->
        <div id="joystick-base" class="hidden">
          <div id="joystick-handle"></div>
        </div>

        <!-- Ambient Hint when not touching -->
        <div class="pointer-events-none text-center opacity-30 flex flex-col items-center">
          <div class="w-20 h-20 rounded-full border-2 border-dashed border-white/40 flex items-center justify-center mb-2">
            <span class="text-2xl">🕹️</span>
          </div>
          <span class="text-[11px] font-mono tracking-widest text-slate-400 uppercase">TOUCH TO STEER</span>
        </div>
      </div>

      <!-- Right Half: Glowing Action Buttons -->
      <div id="buttons-zone" class="w-1/2 h-full relative p-6 flex flex-col justify-between items-center">
        <!-- Upper Row: Secondary Buttons (Boost & Shield) -->
        <div class="w-full flex justify-end gap-5 pt-2">
          <!-- Force Shield Button -->
          <button id="btn-shield" class="gamepad-btn btn-shield-glow w-16 h-16 rounded-2xl flex flex-col items-center justify-center text-white active:scale-90 select-none">
            <span class="text-xl">🛡️</span>
            <span class="text-[9px] font-orbitron font-black tracking-wider uppercase mt-0.5">SHIELD</span>
          </button>

          <!-- Turbo Boost Button -->
          <button id="btn-boost" class="gamepad-btn btn-boost-glow w-16 h-16 rounded-2xl flex flex-col items-center justify-center text-white active:scale-90 select-none">
            <span class="text-xl">⚡</span>
            <span class="text-[9px] font-orbitron font-black tracking-wider uppercase mt-0.5">BOOST</span>
          </button>
        </div>

        <!-- Lower Area: Primary Action / Fire Laser Button -->
        <div class="w-full flex justify-end items-end pb-3 pr-2">
          <button id="btn-fire" class="gamepad-btn btn-fire-glow w-28 h-28 rounded-full flex flex-col items-center justify-center text-white active:scale-90 select-none border-4 border-white/20">
            <span class="text-3xl">🔥</span>
            <span class="text-xs font-orbitron font-black tracking-widest uppercase mt-1">FIRE</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Rematch Modal on Phone -->
    <div id="mobile-rematch-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-6">
      <div class="bg-slate-900 border-2 border-cyan-400 p-6 rounded-3xl w-full max-w-xs text-center shadow-[0_0_40px_rgba(0,240,255,0.3)]">
        <h2 id="mobile-winner-text" class="font-orbitron font-black text-3xl mb-4">🏆 VICTORY!</h2>
        <button id="mobile-rematch-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-orbitron font-bold text-sm tracking-wider text-white shadow-[0_0_20px_rgba(0,240,255,0.4)]">
          READY FOR REMATCH 🔄
        </button>
      </div>
    </div>
  </div>

  <!-- Audio and Gamepad Scripts -->
  <script src="/js/audio.js"></script>
  <script src="/js/controller.js"></script>
</body>
</html>
